<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>PIU 账号绑定</title>
<style nonce="{{NONCE}}">
:root{--bg:#0c0e17;--card:#161928;--card-border:#292f4c;--primary:#6366f1;--primary-hover:#4f46e5;--text:#f1f5f9;--text-muted:#94a3b8;--err-bg:#451a1a;--err-border:#991b1b;--err-text:#fca5a5;--success-bg:#064e3b;--success-border:#059669;--success-text:#a7f3d0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding:12px;min-height:100vh}
.app-container{max-width:420px;margin:0 auto}
header{margin-bottom:12px}
h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px}
.subtitle{font-size:12px;color:var(--text-muted)}
.banner{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;line-height:1.4}
.banner.info{background:#1e293b;border:1px solid #334155;color:#93c5fd}
.banner.warning{background:#422006;border:1px solid #854d0e;color:#fde047}
.banner.error{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err-text)}
.banner.success{background:var(--success-bg);border:1px solid var(--success-border);color:var(--success-text)}
.screen-wrapper{position:relative;width:100%;background:#000;border:1px solid var(--card-border);border-radius:10px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,0.4)}
#screen{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-drag:none}
#overlay{position:absolute;inset:0;pointer-events:none}
.overlay-input{position:absolute;pointer-events:auto;font:inherit;font-size:15px;color:#fff;background:rgba(20,24,39,0.92);border:1.5px solid #6366f1;border-radius:6px;padding:6px 10px;outline:none;box-shadow:0 2px 6px rgba(0,0,0,0.3);transition:border-color .15s,background .15s}
.overlay-input:focus{background:rgba(15,18,30,0.98);border-color:#a5b4fc;box-shadow:0 0 0 2px rgba(99,102,241,0.4)}
.btn-bar{display:flex;gap:8px;margin-top:12px}
.btn{display:block;font:inherit;font-size:15px;font-weight:600;padding:12px;border-radius:8px;border:none;cursor:pointer;text-align:center;transition:background .15s,opacity .15s}
.btn-primary{background:var(--primary);color:#fff;flex:2}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:#232840;color:var(--text);flex:1;font-size:13px}
.btn-secondary:hover{background:#2e3556}
.notice{font-size:11px;color:var(--text-muted);margin-top:12px;line-height:1.5}
.notice strong{color:#cbd5e1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app-container">
  <header>
    <h1>PIU 账号绑定</h1>
    <p class="subtitle">Pump It Up Phoenix 官方页面在线代理交互</p>
  </header>

  <div id="status-bar" class="banner info">正在启动浏览器并连接 PIU 官网...</div>

  <div id="main-view">
    <div class="screen-wrapper" id="screen-box">
      <img id="screen" alt="PIU 官方登录界面" draggable="false">
      <div id="overlay"></div>
    </div>

    <div class="btn-bar">
      <button id="btn-submit" class="btn btn-primary" disabled>登录并完成绑定</button>
      <button id="btn-refresh" class="btn btn-secondary">刷新页面</button>
    </div>

    <p class="notice">
      💡 <strong>操作说明：</strong>请直接在上方官方界面的输入框中点击输入账号、密码（如有验证码一并输入），点击“登录并完成绑定”。账号密码不保存，仅用于向官网换取查分会话。<br>
      不是 PIU 官方扫码登录。若登录失败可直接修改并反复尝试，链接有效期约 5 分钟。
    </p>
  </div>

  <div id="done-view" class="banner success" style="padding:20px;border-radius:10px" hidden>
    <h2 style="font-size:18px;margin-bottom:8px">🎉 绑定成功！</h2>
    <p id="done-msg" style="margin-bottom:12px;font-size:14px"></p>
    <p style="font-size:12px;color:#94a3b8">您现在可以关闭此网页，返回 QQ / 机器人发送 <code>#piu b50</code> 查看 Best50 成绩图。</p>
  </div>
</div>

<script nonce="{{NONCE}}">
(() => {
  'use strict';
  let token = new URLSearchParams(location.hash.slice(1)).get('token');
  if (!token) token = sessionStorage.getItem('piu_active_token');
  else sessionStorage.setItem('piu_active_token', token);
  history.replaceState(null, '', location.pathname);

  let csrf = null, busy = false, finished = false, viewport = null, expiresAt = 0;
  const inputStore = {};
  const $ = id => document.getElementById(id);

  function setStatus(text, type = 'info') {
    const bar = $('status-bar');
    if (!text) { bar.hidden = true; return; }
    bar.hidden = false;
    bar.className = 'banner ' + type;
    bar.textContent = text;
  }

  const api = async (route, data) => {
    const headers = {
      ...(data === undefined ? {} : { 'Content-Type': 'application/json' }),
      ...(csrf ? { 'X-CSRF-Token': csrf } : {})
    };
    const response = await fetch(new URL('api/' + route, location.href), {
      method: data === undefined ? 'GET' : 'POST',
      credentials: 'same-origin',
      cache: 'no-store',
      headers,
      ...(data === undefined ? {} : { body: JSON.stringify(data) })
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || '请求失败，请稍后重试');
    return result;
  };

  function setBusy(val) {
    busy = val;
    $('btn-submit').disabled = val || finished;
    $('btn-refresh').disabled = val || finished;
  }

  async function showState() {
    const state = await api('state');
    viewport = state;
    $('screen').src = 'data:' + state.imageType + ';base64,' + state.image;
    renderOverlay(state);

    if (state.lastDialog) {
      setStatus('官网提示：' + state.lastDialog, 'warning');
    } else {
      const leftSec = Math.max(0, Math.ceil((state.expiresAt - Date.now()) / 1000));
      setStatus('登录会话有效，剩余 ' + leftSec + ' 秒。可直接在画面中输入。', 'info');
    }
  }

  function renderOverlay(state) {
    const overlay = $('overlay');
    overlay.innerHTML = '';
    if (!state.inputs || !state.inputs.length) return;

    for (const inp of state.inputs) {
      if (inp.tag === 'button' || inp.type === 'submit') continue;
      const el = document.createElement('input');
      el.type = inp.type || 'text';
      el.name = inp.name || '';
      el.className = 'overlay-input';
      el.placeholder = inp.placeholder || (inp.type === 'password' ? '请输入密码' : '请输入账号/邮箱');
      el.value = inputStore[inp.name] !== undefined ? inputStore[inp.name] : (inp.value || '');
      el.style.left = (inp.x / state.width * 100) + '%';
      el.style.top = (inp.y / state.height * 100) + '%';
      el.style.width = (inp.width / state.width * 100) + '%';
      el.style.height = (inp.height / state.height * 100) + '%';

      el.addEventListener('input', () => {
        inputStore[inp.name] = el.value;
      });
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          $('btn-submit').click();
        }
      });
      overlay.appendChild(el);
    }
  }

  // 点击画面中非输入框区域：同步点击事件到远程浏览器
  $('screen').addEventListener('click', async event => {
    if (busy || finished || !viewport) return;
    setBusy(true);
    try {
      const rect = $('screen').getBoundingClientRect();
      const x = Math.min(viewport.width - 1, Math.max(0, (event.clientX - rect.left) * viewport.width / rect.width));
      const y = Math.min(viewport.height - 1, Math.max(0, (event.clientY - rect.top) * viewport.height / rect.height));
      await api('action', { type: 'click', x, y });
      await showState();
    } catch (err) {
      setStatus(err.message, 'error');
    } finally {
      setBusy(false);
    }
  });

  async function doSubmit() {
    if (busy || finished) return;
    setBusy(true);
    setStatus('正在向官网提交登录并验证，请稍候...', 'info');
    try {
      // 1. 提交输入框内容并等待响应/弹窗
      await api('action', { type: 'submit', fields: inputStore });
      // 2. 验证登录状态与档案绑定
      const result = await api('finish', {});
      finished = true;
      sessionStorage.removeItem('piu_active_token');
      $('main-view').hidden = true;
      $('status-bar').hidden = true;
      $('done-view').hidden = false;
      const name = result.playerName || 'PIU 玩家';
      const score = result.pumbility != null ? (' · Pumbility: ' + result.pumbility) : '';
      $('done-msg').textContent = '已成功绑定档案：' + name + score;
    } catch (err) {
      setStatus(err.message, 'warning');
      // 失败后刷新截图与界面，让用户可立即再次尝试
      try { await showState(); } catch {}
    } finally {
      setBusy(false);
    }
  }

  $('btn-submit').addEventListener('click', doSubmit);

  $('btn-refresh').addEventListener('click', async () => {
    if (busy || finished) return;
    setBusy(true);
    setStatus('正在刷新远程画面...', 'info');
    try {
      await api('action', { type: 'click', x: 10, y: 10 }).catch(() => {});
      await showState();
    } catch (err) {
      setStatus(err.message, 'error');
    } finally {
      setBusy(false);
    }
  });

  async function init() {
    if (!token || !/^[A-Za-z0-9_-]{43}$/.test(token)) {
      setStatus('缺少有效或已过期的登录链接，请私聊机器人发送 #piu login 重新获取', 'error');
      return;
    }
    setBusy(true);
    try {
      const claim = await api('claim', { token });
      csrf = claim.csrf;
      expiresAt = claim.expiresAt;
      await showState();
    } catch (err) {
      // 若已 claim 过，尝试直接读取状态
      try {
        await showState();
      } catch {
        setStatus(err.message || '登录会话已失效，请重新发送 #piu login', 'error');
      }
    } finally {
      setBusy(false);
    }
  }

  init();
})();
</script>
</body>
</html>
