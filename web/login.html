<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PIU 登录绑定</title>
<style nonce="{{NONCE}}">
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101323;color:#f4f5ff}*{box-sizing:border-box}body{margin:0 auto;max-width:680px;padding:18px}h1{font-size:24px;margin:0 0 12px}p{line-height:1.65}button,input,select{font:inherit;border:1px solid #555b78;border-radius:9px;padding:11px;background:#232943;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:#6769e8;border-color:#888afa}.notice{background:#20263d;padding:14px;border-radius:12px}.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.row input{flex:1;min-width:130px}.row button{flex-shrink:0}label{display:flex;gap:10px;align-items:flex-start;line-height:1.6}label input{margin-top:6px}#screen{width:100%;height:auto;border-radius:8px;display:block;touch-action:manipulation;border:1px solid #414966}#remote{max-width:440px;margin:0 auto}#location{overflow-wrap:anywhere;font-size:12px;color:#b9c1dd}#status{min-height:28px;color:#e3dc9c}small{color:#c4c9dc;line-height:1.6}code{overflow-wrap:anywhere}#finish{width:100%;margin-top:10px}#done{color:#9fe2c1}#keyboard{margin-bottom:18px}[hidden]{display:none!important}
</style>
</head>
<body>
<h1>PIU 账号绑定</h1>
<div id="intro" class="notice">
<p>这是机器人提供的<strong>远程浏览器登录</strong>，不是 PIU 官方扫码登录或 OAuth。扫码后，你将操作机器人服务器里的浏览器，在 PIU / AM.PASS 官方网页中登录。</p>
<p>服务端会处理你输入的内容，并可访问登录后的会话。程序不保存账号密码；完成绑定时只加密保存登录会话。请仅使用你信任的机器人和服务器。登录链接短时有效且只能使用一次，请勿转发。</p>
<label><input id="consent" type="checkbox">我理解上述方式，并同意将当前 PIU 账号的登录会话交给此机器人使用。</label>
<div class="row"><button id="connect" class="primary" disabled>开始登录</button></div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<div id="remote" hidden>
<p><small>点击截图中的输入框，在下方输入内容并发送。遇到验证或登录失败，可刷新截图。请核对下方显示的官方网页地址。</small></p>
<p id="location"></p>
<img id="screen" alt="服务器内官方登录页面的当前截图" draggable="false">
<div id="keyboard">
<div class="row"><input id="text" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="选中网页输入框后在此输入" aria-label="发送到网页输入框的内容"><button id="send">输入</button></div>
<label><input id="visible" type="checkbox">显示输入内容</label>
<div class="row"><button data-key="Tab">下一输入框</button><button data-key="Enter">回车</button><button data-key="Backspace">退格</button><button id="refresh">刷新截图</button></div>
<div class="row"><button data-scroll="-600">向上滚动</button><button data-scroll="600">向下滚动</button></div>
<button id="finish" class="primary">我已登录，验证并完成绑定</button>
<div class="row"><button id="cancel">取消并关闭此登录会话</button></div>
</div>
</div>
<p id="done" hidden>绑定成功。可以关闭此页，回到机器人发送 Best50 命令。</p>
<script nonce="{{NONCE}}">
(() => {
  'use strict';
  let token = new URLSearchParams(location.hash.slice(1)).get('token');
  history.replaceState(null, '', location.pathname);
  let csrf = null, busy = false, finished = false, viewport = null, expiresAt = 0;
  const $ = id => document.getElementById(id);
  const status = text => { $('status').textContent = text; };
  const api = async (route, data) => {
    const response = await fetch(new URL('api/' + route, location.href), {
      method: data === undefined ? 'GET' : 'POST', credentials: 'same-origin', cache: 'no-store',
      headers: { ...(data === undefined ? {} : { 'Content-Type': 'application/json' }), ...(csrf ? { 'X-CSRF-Token': csrf } : {}) },
      ...(data === undefined ? {} : { body: JSON.stringify(data) })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || '操作失败');
    return result;
  };
  function setBusy(value) {
    busy = value;
    document.querySelectorAll('#remote button').forEach(button => { button.disabled = value || finished; });
  }
  async function showState() {
    const state = await api('state');
    viewport = state;
    $('screen').src = 'data:' + state.imageType + ';base64,' + state.image;
    $('location').textContent = state.url;
    const remaining = Math.max(0, Math.ceil((state.expiresAt - Date.now()) / 1000));
    status('登录会话剩余 ' + remaining + ' 秒。');
  }
  async function run(fn) {
    if (busy || finished) return;
    setBusy(true);
    try { await fn(); }
    catch (error) { status(error.message); }
    finally { setBusy(false); }
  }
  async function action(data) { await api('action', data); await showState(); }
  $('consent').addEventListener('change', () => { $('connect').disabled = !$('consent').checked || !token; });
  $('connect').addEventListener('click', () => run(async () => {
    $('connect').disabled = true;
    status('正在启动登录浏览器……');
    const claim = await api('claim', { token });
    token = null;
    csrf = claim.csrf;
    expiresAt = claim.expiresAt;
    $('intro').hidden = true;
    $('remote').hidden = false;
    await showState();
  }));
  $('screen').addEventListener('click', event => run(async () => {
    if (!viewport) return;
    const rect = $('screen').getBoundingClientRect();
    await action({ type: 'click', x: Math.min(viewport.width - 1, Math.max(0, (event.clientX - rect.left) * viewport.width / rect.width)), y: Math.min(viewport.height - 1, Math.max(0, (event.clientY - rect.top) * viewport.height / rect.height)) });
    $('text').focus();
  }));
  const send = () => run(async () => {
    const text = $('text').value;
    $('text').value = '';
    await action({ type: 'type', text, replace: true });
  });
  $('send').addEventListener('click', send);
  $('text').addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); send(); } });
  $('visible').addEventListener('change', () => { $('text').type = $('visible').checked ? 'text' : 'password'; });
  document.querySelectorAll('[data-key]').forEach(button => button.addEventListener('click', () => run(() => action({ type: 'key', key: button.dataset.key }))));
  document.querySelectorAll('[data-scroll]').forEach(button => button.addEventListener('click', () => run(() => action({ type: 'scroll', deltaY: Number(button.dataset.scroll) }))));
  $('refresh').addEventListener('click', () => run(showState));
  $('finish').addEventListener('click', () => run(async () => {
    status('正在验证官方登录状态……');
    await api('finish', {});
    finished = true; csrf = null;
    $('text').value = ''; $('screen').removeAttribute('src'); $('remote').hidden = true; $('done').hidden = false;
    status('');
  }));
  $('cancel').addEventListener('click', () => run(async () => {
    await api('cancel', {}); finished = true; csrf = null;
    $('text').value = ''; $('screen').removeAttribute('src'); $('remote').hidden = true;
    status('登录会话已关闭，未保存此次登录。');
  }));
  setInterval(() => {
    if (expiresAt && Date.now() >= expiresAt && !finished) {
      finished = true; csrf = null; $('text').value = ''; $('screen').removeAttribute('src'); $('remote').hidden = true;
      status('登录会话已过期，请回到机器人重新绑定。');
    }
  }, 1000);
  if (!token || !/^[A-Za-z0-9_-]{43}$/.test(token)) {
    token = null;
    status('缺少有效的登录链接，请从机器人的绑定二维码重新打开。');
  }
})();
</script>
</body>
</html>
