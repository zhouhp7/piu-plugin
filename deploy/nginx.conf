# 把 piu.example.com 和证书路径替换为自己的设置。
# 此文件是示例，需由现有 Nginx 配置 include。
server {
    listen 80;
    server_name piu.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name piu.example.com;
    ssl_certificate /etc/letsencrypt/live/piu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/piu.example.com/privkey.pem;
    client_max_body_size 32k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
